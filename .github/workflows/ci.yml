name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Run test suite
        working-directory: apps/api
        env:
          LOCALDEPLOY_DOCKER_DISABLED: "true"
          LOCALDEPLOY_SECRET_KEY: ci-test-secret
        run: pytest -q

  dashboard-build:
    name: Dashboard build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Type-checked production build
        working-directory: apps/dashboard
        run: npm run build
